[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "openscad-mcp"
version = "0.2.0"
description = "MCP server for OpenSCAD 3D modelling via CLI"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=1.5.0"]

[tool.setuptools.packages.find]
where = ["src"]
