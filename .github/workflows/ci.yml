name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install OpenSCAD (the tools shell out to the CLI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version
      - name: Install from uv.lock
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: uv sync --locked --extra dev
      - name: Run the test suite against the real OpenSCAD CLI
        # REQUIRE_OPENSCAD makes a missing binary a failure instead of a silent skip.
        env:
          REQUIRE_OPENSCAD: "1"
          UV_PYTHON: ${{ matrix.python }}
        run: uv run --locked --extra dev pytest -q tests

  lint:
    name: ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install lint tooling (hash-pinned)
        run: python -m pip install --require-hashes -r .github/requirements-ci.lock
      # The legacy code has style findings under ruff's defaults; this selection is
      # limited to syntax errors, invalid comparisons/prints and undefined names.
      - name: Ruff (E9, F63, F7, F82)
        run: ruff check --select E9,F63,F7,F82 .

  audit:
    name: security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install audit tooling (hash-pinned)
        run: python -m pip install --require-hashes -r .github/requirements-ci.lock
      - name: Known vulnerabilities in the CI toolchain
        run: pip-audit --strict --no-deps -r .github/requirements-ci.lock --progress-spinner off
      - name: Known vulnerabilities in the locked dependencies
        run: |
          uv export --locked --no-emit-project --no-hashes -o "$RUNNER_TEMP/locked-requirements.txt"
          pip-audit --strict --no-deps -r "$RUNNER_TEMP/locked-requirements.txt" --progress-spinner off
      - name: Audit the workflows themselves
        run: zizmor --format plain .github/workflows/
