name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: build, attest and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
      id-token: write # Sigstore OIDC for provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse to release if the tag and the declared version disagree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          declared=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${TAG#v}" != "$declared" ]; then
            echo "tag $TAG does not match declared version $declared" >&2
            exit 1
          fi
          grep -q "^## \[$declared\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$declared] section" >&2; exit 1; }

      - name: Archive the source tree users actually run
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="${REPO}-${TAG}/" -o "dist/${REPO}-${TAG}.tar.gz" HEAD

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # CycloneDX SBOM of the runtime dependencies pinned in uv.lock.
      - name: Software bill of materials
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r .github/requirements-ci.lock
          uv export --locked --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/runtime-requirements.txt"
          cyclonedx-py requirements "$RUNNER_TEMP/runtime-requirements.txt" --output-format JSON -o "dist/${REPO}-${TAG}.cdx.json"

      # GitHub-hosted Sigstore provenance; verify with
      #   gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "See CHANGELOG.md for details. Every artifact here carries build provenance; verify with: gh attestation verify <file> --repo $GITHUB_REPOSITORY" \
            dist/*
